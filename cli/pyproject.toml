[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "duelist"
version = "1.0.0"
description = "DueSync CLI (duelist): Fast terminal deadline tracker with Google Sheets sync and export reports"
authors = [{ name = "DueSync Team" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "gspread>=6.0.0",
    "google-auth>=2.0.0",
    "python-dateutil>=2.8.0",
    "colorama>=0.4.6",
    "python-docx>=1.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[project.scripts]
duelist = "duelist.tracker:main"
